<!DOCTYPE html>
<html>
<head>
    <title>jQuery AJAX Navigation Menu</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        nav {
            background-color: #333;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
            font-size: 18px;
        }

        nav a:hover {
            color: yellow;
        }

        #content {
            padding: 30px;
        }
    </style>
</head>

<body>

    <nav>
        <a href="#" data-page="home.html">Home</a>
        <a href="#" data-page="about.html">About</a>
        <a href="#" data-page="products.html">Products</a>
    </nav>

    <div id="content">
        <h2>Welcome</h2>
        <p>Click on any menu item to load content using AJAX.</p>
    </div>

    <script src="script.js"></script>

</body>
</html>
